<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A personal library of landing page sections for US and Canadian businesses." />
    <title>Sectionkit</title>
    <script>
      // Apply the saved theme before React renders to avoid a light/dark flash.
      (function () {
        var mode = 'light';
        try {
          var saved = localStorage.getItem('sectionkit:theme');
          if (saved === 'light' || saved === 'dark') mode = saved;
          else if (window.matchMedia('(prefers-color-scheme: dark)').matches) mode = 'dark';
        } catch (e) {}
        document.documentElement.dataset.theme = mode;
        document.documentElement.style.colorScheme = mode;
        document.documentElement.style.background = mode === 'dark' ? '#171816' : '#F7F7F5';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
